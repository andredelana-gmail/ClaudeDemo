<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Line Simulator</title>
<style>
  /* ---- Theme tokens (dark by default, light via prefers-color-scheme) -- */
  :root {
    --bg: #0f172a; --panel: #111c34; --panel2: #0b1428;
    --text: #e2e8f0; --muted: #94a3b8;
    --node-bg: #1e293b; --grid: #1e293b; --arrow: #64748b;
    --bar-bg: #334155; --border: #24324d; --accent: #3b82f6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f1f5f9; --panel: #ffffff; --panel2: #f8fafc;
      --text: #0f172a; --muted: #64748b;
      --node-bg: #ffffff; --grid: #e2e8f0; --arrow: #94a3b8;
      --bar-bg: #e2e8f0; --border: #e2e8f0; --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }

  /* ---- Top control bar ------------------------------------------------ */
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header .title { font-weight: 700; font-size: 15px; margin-right: 4px; white-space: nowrap; }
  #line-name {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 190px;
  }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 11px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.active, .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
  .clock {
    font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600;
    background: var(--panel2); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
  }
  .speed-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #speed { width: 110px; }
  select.btn { padding-right: 6px; }

  /* ---- Main layout ---------------------------------------------------- */
  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  #canvas-wrap { position: relative; overflow: hidden; }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; background: var(--panel2); }

  /* ---- Right side panel ----------------------------------------------- */
  aside {
    background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px;
  }
  aside h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }

  /* dashboard tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .tile.hi { grid-column: 1 / -1; border-color: #ef4444; }
  .t-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile.hi .t-val { color: #ef4444; font-size: 15px; }
  .t-lab { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* station table */
  table.stations { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.stations th { color: var(--muted); font-weight: 500; text-align: right; padding: 3px 4px; }
  table.stations th:first-child { text-align: left; }
  table.stations td { text-align: right; padding: 3px 4px; font-variant-numeric: tabular-nums; }
  table.stations td:first-child { text-align: left; }
  table.stations tr.bn td { color: #ef4444; font-weight: 700; }

  #chart { width: 100%; height: 120px; display: block; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); }

  /* config fields */
  .fld { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .fld input, .fld select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .cfg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; font-size: 14px; }
  .del-btn { background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .cfg-metrics { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .mrow { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; color: var(--muted); }
  .mrow b { color: var(--text); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .grow { flex: 1; }

  /* type picker popup */
  .popup {
    position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.4); padding: 6px; min-width: 160px;
  }
  .popup-title { font-size: 11px; color: var(--muted); padding: 4px 8px; text-transform: uppercase; letter-spacing: .5px; }
  .popup-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .popup-item:hover { background: var(--panel2); }
  .popup-item .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* toast */
  #toast {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1e293b; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: all .2s; pointer-events: none; z-index: 30; border: 1px solid var(--border);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { max-height: 45vh; }
  }
</style>
</head>
<body>
  <!-- ===================== Control bar ===================== -->
  <header>
    <span class="title">⚙ Production Line Simulator</span>
    <input id="line-name" title="Line name" value="Untitled line">
    <div class="sep"></div>
    <button class="btn primary" id="btn-play">▶ Play</button>
    <button class="btn" id="btn-step" title="Advance one tick">⏭ Step</button>
    <button class="btn" id="btn-reset">↺ Reset</button>
    <div class="speed-wrap">
      <span>Speed</span>
      <input type="range" id="speed" min="1" max="200" value="20">
      <span id="speed-val">20×</span>
    </div>
    <span class="clock" id="clock">00:00:00</span>
    <div class="sep"></div>
    <button class="btn" id="btn-fit" title="Fit to view">⤢ Fit</button>
    <select class="btn" id="preset-select" title="Load a preset line">
      <option value="">Presets…</option>
      <option value="bottleneck">Bottleneck line (3 stations)</option>
      <option value="simple">Simple line</option>
      <option value="packaging">Packaging line</option>
    </select>
    <div class="sep"></div>
    <button class="btn" id="btn-save" title="Save to browser">💾 Save</button>
    <button class="btn" id="btn-load" title="Load from browser">📂 Load</button>
    <button class="btn" id="btn-export">⭳ Export</button>
    <button class="btn" id="btn-import">⭱ Import</button>
    <button class="btn" id="btn-clear" title="Empty canvas">🗑 Clear</button>
    <input type="file" id="import-file" accept="application/json" style="display:none">
  </header>

  <!-- ===================== Main area ======================= -->
  <main>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="toast"></div>
    </div>

    <aside>
      <!-- Dashboard -->
      <div class="card">
        <h3>Live dashboard</h3>
        <div class="tiles" id="dash"></div>
        <table class="stations" id="station-table"></table>
      </div>

      <!-- Throughput chart -->
      <div class="card">
        <h3>Throughput</h3>
        <canvas id="chart"></canvas>
      </div>

      <!-- Config panel -->
      <div class="card grow">
        <h3>Configuration</h3>
        <div id="config"></div>
      </div>

      <!-- Global run settings -->
      <div class="card">
        <h3>Run settings</h3>
        <div id="global-settings"></div>
      </div>

      <!-- Legend -->
      <div class="card">
        <h3>Legend</h3>
        <div class="legend">
          <span><i style="background:#22c55e"></i>Running</span>
          <span><i style="background:#eab308"></i>Idle / starved</span>
          <span><i style="background:#ef4444"></i>Blocked / bottleneck</span>
          <span><i style="background:#a855f7"></i>Breakdown</span>
        </div>
      </div>
    </aside>
  </main>

  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
